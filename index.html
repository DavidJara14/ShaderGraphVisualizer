<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShaderGraph Visualizer</title>
  <!-- CSS imported via main.ts for Vite HMR -->
</head>
<body>
  <div id="app">
    <div id="toolbar"></div>
    <div id="main">
      <div id="blackboard" class="panel">
        <div class="panel-header">Blackboard</div>
        <div id="blackboard-content"></div>
      </div>
      <div id="graph-canvas"></div>
      <div id="right-resize-handle" class="resize-handle-h"></div>
      <div id="right-panels">
        <div id="inspector" class="panel">
          <div class="panel-header">Inspector</div>
          <div id="inspector-content"></div>
        </div>
        <div id="preview-resize-handle" class="resize-handle-v"></div>
        <div id="preview" class="panel">
          <div class="panel-header">Main Preview</div>
          <div id="preview-container"></div>
        </div>
      </div>
    </div>
    <!-- Mobile panel toggle buttons -->
    <div id="mobile-tabs">
      <button class="mobile-tab" data-panel="graph" aria-label="Graph">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><line x1="10" y1="6.5" x2="14" y2="6.5"/><line x1="6.5" y1="10" x2="6.5" y2="14"/></svg>
        <span>Graph</span>
      </button>
      <button class="mobile-tab" data-panel="edit" aria-label="Edit">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>Edit</span>
      </button>
      <button class="mobile-tab" data-panel="inspector" aria-label="Inspector">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4m-2.93-7.07l-2.83 2.83m-8.48 8.48l-2.83 2.83m0-14.14l2.83 2.83m8.48 8.48l2.83 2.83"/></svg>
        <span>Inspector</span>
      </button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
